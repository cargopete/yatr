# YATR's own YATR.toml - we eat our own dog food 🐕

[env]
RUST_BACKTRACE = "1"

[settings]
cache = true
watch_debounce_ms = 200

# ─────────────────────────────────────────────────────────────
# Development tasks
# ─────────────────────────────────────────────────────────────

# `yatr ci` is what .github/workflows/ci.yml runs on its Linux leg, plus the
# AGENTS.md check. The audit job is `yatr audit`: advisories arrive without the
# tree changing, so it is not part of a cached gate.

[tasks.fmt]
desc = "Format code"
run = ["cargo fmt --all"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if the tree is unformatted"
run = ["cargo fmt --all --check"]
sources = ["**/*.rs"]

[tasks.lint]
desc = "Run clippy (advisory, as in CI: warnings are printed, not denied)"
run = ["cargo clippy --all-targets --locked"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock", ".cargo/config.toml"]

[tasks.test]
desc = "Run tests"
run = ["cargo test --locked"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock", ".cargo/config.toml", "yatr.schema.json"]
watch = ["src/**/*.rs", "tests/**/*.rs"]

[tasks.agents-check]
desc = "Fail if AGENTS.md has drifted from the tasks in this file"
run = ["cargo run --quiet --locked -- agents --check"]
sources = ["yatr.toml", "AGENTS.md", "src/**/*.rs", "Cargo.lock"]

[tasks.ci]
desc = "What CI runs: fmt-check, lint, test, and the AGENTS.md check"
depends = ["fmt-check", "lint", "test", "agents-check"]
run = []

# ─────────────────────────────────────────────────────────────
# Build tasks
# ─────────────────────────────────────────────────────────────

[tasks.build]
desc = "Build debug binary"
run = ["cargo build"]
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]

[tasks.release]
desc = "Build optimized release binary"
depends = ["ci"]
run = ["cargo build --release"]
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]
outputs = ["target/release/yatr"]

# ─────────────────────────────────────────────────────────────
# Documentation
# ─────────────────────────────────────────────────────────────

[tasks.doc]
desc = "Generate documentation and open it"
run = ["cargo doc --no-deps --open"]
no_cache = true

[tasks.readme]
desc = "Check README code examples"
run = ["cargo readme > /dev/null"]
shell = true
no_cache = true
allow_failure = true

# ─────────────────────────────────────────────────────────────
# Utility tasks
# ─────────────────────────────────────────────────────────────

[tasks.clean]
desc = "Clean build artifacts"
no_cache = true
run = ["cargo clean"]

[tasks.update]
desc = "Update dependencies"
no_cache = true
run = ["cargo update"]

[tasks.outdated]
desc = "Check for outdated dependencies"
no_cache = true
run = ["cargo outdated"]
allow_failure = true

[tasks.audit]
desc = "Security audit dependencies"
no_cache = true
run = ["cargo audit"]
allow_failure = true

# ─────────────────────────────────────────────────────────────
# Release tasks
# ─────────────────────────────────────────────────────────────

[tasks.bump-patch]
desc = "Bump patch version"
no_cache = true
script = '''
    let cargo = read_file("Cargo.toml");
    let lines = cargo.split("\n");
    
    for line in lines {
        if line.starts_with("version = ") {
            let version = line.replace("version = ", "").replace("\"", "");
            let new_version = semver_bump(version, "patch");
            print(`Bumping version: ${version} -> ${new_version}`);
            
            let updated = cargo.replace(
                `version = "${version}"`, 
                `version = "${new_version}"`
            );
            write_file("Cargo.toml", updated);
            break;
        }
    }
'''

[tasks.bump-minor]
desc = "Bump minor version"
no_cache = true
script = '''
    let cargo = read_file("Cargo.toml");
    let lines = cargo.split("\n");
    
    for line in lines {
        if line.starts_with("version = ") {
            let version = line.replace("version = ", "").replace("\"", "");
            let new_version = semver_bump(version, "minor");
            print(`Bumping version: ${version} -> ${new_version}`);
            
            let updated = cargo.replace(
                `version = "${version}"`, 
                `version = "${new_version}"`
            );
            write_file("Cargo.toml", updated);
            break;
        }
    }
'''

[tasks.publish-dry]
desc = "Dry-run publish to crates.io"
depends = ["ci"]
no_cache = true
run = ["cargo publish --dry-run"]

[tasks.publish]
desc = "Publish to crates.io"
depends = ["ci"]
no_cache = true
run = ["cargo publish"]

# ─────────────────────────────────────────────────────────────
# Development workflow
# ─────────────────────────────────────────────────────────────

[tasks.dev]
desc = "Run in watch mode during development"
foreground = true
run = ["cargo watch -x 'test' -x 'clippy'"]

[tasks.install-local]
desc = "Install yatr locally from source"
depends = ["release"]
no_cache = true
run = ["cargo install --path ."]
